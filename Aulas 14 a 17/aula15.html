  contador++;
  console.log(contador);

  if (contador === 10) {
    clearInterval(intervalo);
  }

//Exercício 3: Faça uma função que, ao ser chamada, inicie um `setInterval` e outra que pare esse intervalo. 


let intervalo;

function iniciar() {
  intervalo = setInterval(() => {
    console.log("Executando...");
  }, 1000);
}

function parar() {
  clearInterval(intervalo);
  console.log("Parado!");
}

//Exercício 4: (Desafio) Implemente um cronômetro com `setInterval`, mostrando minutos e segundos. 

let segundos = 0;
let minutos = 0;

const cronometro = setInterval(() => {
  segundos++;

  if (segundos === 60) {
    segundos = 0;
    minutos++;
  }

  console.log(
    `${String(minutos).padStart(2, "0")}:${String(segundos).padStart(2, "0")}`
  );
}, 1000);
